<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <script src="sdpi-components.js"></script>
    <!-- On its own a color swatch stretches across the whole row, which is
         a lot of pink. This keeps it to a small box. -->
    <style>
      sdpi-color {
        display: block;
        width: 36px;
      }
    </style>
  </head>
  <body>
    <!-- Push always plays and pauses. This picks what a turn does, and
         the bar on the strip follows it: volume, or how far into the song. -->
    <sdpi-item label="Turning">
      <sdpi-select setting="turns" default="volume">
        <option value="volume">Changes the volume</option>
        <option value="track">Skips songs</option>
      </sdpi-select>
    </sdpi-item>
    <!-- The volume bar's color. It starts out as my soft pink.
         Anything that isn't a plain hex color falls back to that. -->
    <sdpi-item label="Volume color">
      <sdpi-color setting="volumeColor" default="#f2a7c3"></sdpi-color>
    </sdpi-item>
  </body>
</html>
